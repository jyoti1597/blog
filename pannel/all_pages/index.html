<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard UI</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/media.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <div class="dashboard">

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <img src="assets/images/logo_image.png" alt="Logo">
                <a href="#" class="closeBtn"><i class="fa fa-close"></i></a>
            </div>
            <ul>
                <li><a href="#"><i class="fa fa-home"></i> Home</a></li>
                <li><a href="#"><i class="fa fa-th-large"></i> Categories</a></li>
                <li><a href="#"><i class="fa fa-newspaper-o"></i> Blog</a></li>
                <li><a href="#"><i class="fa fa-user"></i> Users</a></li>
            </ul>
            <div class="logout">
                <div class="profileSection">
                    <img src="assets/images/profile.png" alt="Profile">
                    <span>Admin</span>
                </div>
                <a href="#" class="logoutBtn"><i class="fa fa-sign-out"></i> Logout</a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">

            <!-- Topbar -->
            <div class="topbar">
                <a href="#" class="toggle"><i class="fa fa-bars"></i></a>
                <h3>Welcome to New Blog!</h3>
            </div>

            <!-- Cards -->
            <div class="countSection">
                <div class="card">
                    <h3>Users</h3>
                    <p>+ 1,245</p>
                </div>

                <div class="card">
                    <h3>Categories</h3>
                    <p>+ 25</p>
                </div>

                <div class="card">
                    <h3>Blog Posts</h3>
                    <p>+ 320</p>
                </div>
            </div>

        </div>
    </div>
    <script src="assets/js/script.js"></script>
</body>
</html>
